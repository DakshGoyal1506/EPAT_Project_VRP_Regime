# Phase 0 configuration only.
# Downloaders are not implemented yet.
# scripts/download_data.py --dry-run should read this file and print the intended sources.

version: 1

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  broker_cache_dir: data/broker_cache

download_policy:
  phase_0_dry_run_only: true
  overwrite_existing: false
  fail_on_empty_download: true
  write_raw_copy: true
  write_interim_parquet: true

canonical_columns:
  - date
  - open
  - high
  - low
  - close
  - adj_close
  - volume
  - source
  - market
  - symbol

sources:
  - source_id: cboe_vix
    enabled: true
    provider: cboe
    market: US
    asset_type: implied_volatility_index
    symbol: VIX
    description: Official CBOE VIX historical data.
    access_method: csv_download
    url_env_var: CBOE_VIX_URL
    raw_output: data/raw/us/cboe_vix.csv
    interim_output: data/interim/us/cboe_vix.parquet
    notes: Primary US implied volatility proxy.

  - source_id: fred_vixcls
    enabled: true
    provider: fred
    market: US
    asset_type: implied_volatility_index
    symbol: VIXCLS
    description: FRED VIXCLS daily close series.
    access_method: pandas_datareader
    api_key_env_var: FRED_API_KEY
    raw_output: data/raw/us/fred_vixcls.csv
    interim_output: data/interim/us/fred_vixcls.parquet
    notes: Supplementary VIX close source for audit and fallback.

  - source_id: yahoo_spx
    enabled: true
    provider: yahoo_finance
    market: US
    asset_type: equity_index
    symbol: "^GSPC"
    description: S&P 500 index OHLCV from Yahoo Finance.
    access_method: yfinance
    raw_output: data/raw/us/yahoo_gspc.csv
    interim_output: data/interim/us/yahoo_gspc.parquet
    notes: Main US underlying index series.

  - source_id: yahoo_spy
    enabled: true
    provider: yahoo_finance
    market: US
    asset_type: equity_etf
    symbol: SPY
    description: SPY ETF OHLCV from Yahoo Finance.
    access_method: yfinance
    raw_output: data/raw/us/yahoo_spy.csv
    interim_output: data/interim/us/yahoo_spy.parquet
    notes: Tradable proxy and fallback for SPX.

  - source_id: yahoo_vix
    enabled: true
    provider: yahoo_finance
    market: US
    asset_type: implied_volatility_index
    symbol: "^VIX"
    description: VIX OHLCV mirror from Yahoo Finance.
    access_method: yfinance
    raw_output: data/raw/us/yahoo_vix.csv
    interim_output: data/interim/us/yahoo_vix.parquet
    notes: Programmatic VIX mirror; not preferred over CBOE for final audit.

  - source_id: nse_india_vix
    enabled: true
    provider: nse
    market: INDIA
    asset_type: implied_volatility_index
    symbol: INDIA_VIX
    description: Official NSE India VIX historical data.
    access_method: nse_download
    raw_output: data/raw/india/nse_india_vix.csv
    interim_output: data/interim/india/nse_india_vix.parquet
    notes: Primary India implied volatility proxy.

  - source_id: yahoo_india_vix
    enabled: true
    provider: yahoo_finance
    market: INDIA
    asset_type: implied_volatility_index
    symbol: "^INDIAVIX"
    description: India VIX mirror from Yahoo Finance.
    access_method: yfinance
    raw_output: data/raw/india/yahoo_indiavix.csv
    interim_output: data/interim/india/yahoo_indiavix.parquet
    notes: Programmatic fallback for NSE India VIX.

  - source_id: yahoo_nifty
    enabled: true
    provider: yahoo_finance
    market: INDIA
    asset_type: equity_index
    symbol: "^NSEI"
    description: NIFTY 50 OHLCV from Yahoo Finance.
    access_method: yfinance
    raw_output: data/raw/india/yahoo_nsei.csv
    interim_output: data/interim/india/yahoo_nsei.parquet
    notes: Main India underlying index series.

  - source_id: ibkr_paper_cache
    enabled: false
    provider: ibkr_ibridgepy
    market: MULTI
    asset_type: broker_cache
    symbol: null
    description: Optional broker-side paper data cache.
    access_method: ibridgepy
    raw_output: data/broker_cache/ibkr_paper_cache.parquet
    interim_output: null
    notes: Optional only. Not required for research reproducibility. Must not place live orders.